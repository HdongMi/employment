<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>고용24 - 스마트 채용 가이드</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── 고용24 전용 추가 스타일 ── */
    .brand-icon { font-size: 20px; line-height: 1; }

    /* 카테고리 필터 칩 */
    .chip-row {
      display: flex;
      gap: 8px;
      padding: 0 24px 14px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      border-top: 1px solid var(--border-light);
    }
    .chip-row::-webkit-scrollbar { display: none; }

    .chip {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 50px;
      border: 1.5px solid var(--border);
      background: var(--white);
      font-size: 13px;
      font-weight: 600;
      font-family: var(--font-main);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .chip:hover { border-color: var(--text-primary); color: var(--text-primary); }
    .chip.active {
      background: var(--text-primary);
      color: var(--white);
      border-color: var(--text-primary);
    }

    /* 카드 추가 요소 */
    .card-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .tag {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--accent-soft);
      color: var(--text-secondary);
      font-weight: 600;
    }

    /* 상세 – 추가 필드 */
    .detail-desc {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.7;
      letter-spacing: -0.2px;
    }
    .detail-desc strong { color: var(--text-primary); font-weight: 700; }

    /* 탭 – 채용공고/정책 구분 */
    .page-tab-row {
      display: flex;
      gap: 0;
      padding: 12px 24px 0;
    }
    .page-tab {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      font-family: var(--font-main);
      color: var(--text-muted);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
    }
    .page-tab.active {
      color: var(--text-primary);
      border-bottom-color: var(--text-primary);
    }

    /* 섹션 헤더 */
    .list-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px 2px;
    }
    .list-section-header span {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .list-section-header strong {
      font-size: 13px;
      color: var(--text-primary);
      font-weight: 700;
    }

    /* 스켈레톤 로딩 */
    .skeleton-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 22px 20px;
      border: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .skel {
      border-radius: 6px;
      background: linear-gradient(90deg, var(--border-light) 25%, var(--off-white) 50%, var(--border-light) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .skel-title { height: 18px; width: 70%; }
    .skel-sub   { height: 13px; width: 45%; }
    .skel-sub2  { height: 13px; width: 55%; }

    /* 빠른 메뉴 */
    .quick-menu {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 16px 16px 4px;
    }
    .quick-item {
      background: var(--white);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 14px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      cursor: pointer;
      transition: box-shadow 0.15s, transform 0.12s;
      box-shadow: var(--shadow-sm);
    }
    .quick-item:active { transform: scale(0.96); }
    .quick-item:hover { box-shadow: var(--shadow-md); }
    .quick-icon { font-size: 22px; line-height: 1; }
    .quick-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      text-align: center;
      line-height: 1.3;
      font-family: var(--font-main);
    }

    /* 섹션 타이틀 */
    .section-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-primary);
      padding: 16px 16px 6px;
      letter-spacing: -0.3px;
    }

    /* 에러 배너 */
    .error-banner {
      margin: 0 16px;
      padding: 12px 16px;
      background: #fff8e1;
      border: 1px solid #ffe082;
      border-radius: var(--radius-md);
      font-size: 13px;
      color: #795548;
      font-weight: 500;
      display: none;
    }
    .error-banner.show { display: block; }
  </style>
</head>
<body>

          <button class="toggle-btn active" data-state="open">모집중</button>
          <button class="toggle-btn" data-state="closed">마감</button>

      <!-- 카테고리 칩 (채용공고) -->

        <button class="chip active" data-cat="all">전체</button>

        <button class="chip" data-cat="계약직">계약직</button>

      </div>
    </header>

    <!-- 에러 배너 -->
    <div id="errorBanner" class="error-banner">
      ⚠️ 실시간 데이터를 불러오지 못했습니다. 샘플 데이터를 표시합니다.
    </div>

    <!-- ─── MAIN LIST ─── -->
    <main id="policyList"></main>
  </div>

    <button class="back-btn" id="backBtn">

      type: '정규직', salary: '면접 후 결정', deadline: '2025-05-31', status: 'closed',

  const SAMPLE_POLICIES = [
    {

      type: '취업지원', salary: '월 50만원(6개월)', deadline: '상시', status: 'open',
      cat: '청년', link: 'https://www.work24.go.kr/cm/c/1000/selectPolicyInfoByJobSeeker.do',
      desc: '취업을 원하는 저소득 구직자에게 취업지원 서비스와 함께 구직촉진수당을 제공합니다.'
    },
    {
      id: 'p2', title: '청년도약계좌 연계 취업지원', company: '금융위원회', location: '전국',
      type: '금융지원', salary: '월 최대 70만원 매칭', deadline: '2025-12-31', status: 'open',

      type: '직업훈련', salary: '최대 500만원 훈련비 지원', deadline: '상시', status: 'open',

      type: '기업지원', salary: '월 최대 80만원 지급', deadline: '상시', status: 'open',

      desc: '장애인을 고용하는 사업주에게 인건비 일부를 보조하는 장려금 제도.'

  /* ── 상태 ── */
  let state = {
    page: 'jobs',          // jobs | policy | favorites
    filterState: 'open',
    cat: 'all',
    query: '',
    currentItem: null,
    favorites: JSON.parse(localStorage.getItem('emp24_favs') || '[]'),
    jobs: [],
    policies: [],
    loaded: false,
  };

  /* ── DOM ── */
  const listEl      = document.getElementById('policyList');
  const detailEl    = document.getElementById('detailView');
  const backBtn     = document.getElementById('backBtn');
  const searchInput = document.getElementById('searchInput');
  const filterRow   = document.getElementById('jobFilterRow');
  const chipRow     = document.getElementById('chipRow');
  const errorBanner = document.getElementById('errorBanner');
  const overlay     = document.getElementById('loadingOverlay');

  /* ── 초기화 ── */
  init();

  async function init() {
    bindEvents();
    await loadJobData();
    render();
  }

  /* ── 고용24 공개 RSS / API 시도 ── */
  async function loadJobData() {
    // 고용24는 직접 CORS 허용 API가 없으므로
    // 1) rss2json 프록시로 구직정보 RSS 시도
    // 2) 실패 시 sample fallback
    try {
      const rssUrl = 'https://www.work24.go.kr/cm/c/1000/rss/rssRecruitList.do';
      const proxyUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}&count=40`;
      const res = await fetch(proxyUrl, { signal: AbortSignal.timeout(6000) });
      const json = await res.json();

      if (json.status === 'ok' && json.items && json.items.length > 0) {
        state.jobs = json.items.map((item, i) => parseRssItem(item, i));
        errorBanner.classList.remove('show');
      } else {
        throw new Error('empty');
      }
    } catch(e) {
      // fallback
      state.jobs = SAMPLE_JOBS;
      errorBanner.classList.add('show');
    }

    state.policies = SAMPLE_POLICIES;
    state.loaded = true;
  }

  function parseRssItem(item, i) {
    // RSS 아이템을 내부 포맷으로 변환
    const title = item.title || '제목 없음';
    const desc  = stripHtml(item.description || '');
    const link  = item.link || 'https://www.work24.go.kr';

    // 마감일 추출 시도
    const deadlineMatch = desc.match(/(\d{4}[-./]\d{2}[-./]\d{2})/);
    const deadline = deadlineMatch ? deadlineMatch[1] : '상시모집';

    // 마감 여부 추론
    let status = 'open';
    if (deadlineMatch) {
      const d = new Date(deadlineMatch[1]);
      if (!isNaN(d) && d < new Date()) status = 'closed';
    }

    // 지역 추출 시도
    const regions = ['서울','경기','인천','부산','대구','광주','대전','울산','세종','강원','충북','충남','전북','전남','경북','경남','제주'];
    const foundRegion = regions.find(r => (title + desc).includes(r)) || '전국';

    // 카테고리
    const cats = ['정규직','계약직','청년','시니어','장애인','외국인'];
    const foundCat = cats.find(c => (title + desc).includes(c)) || '정규직';

    return {
      id: 'r' + i,
      title,
      company: extractCompany(desc) || item.author || '정보 없음',
      location: foundRegion,
      type: foundCat,
      salary: extractSalary(desc) || '면접 후 결정',
      deadline,
      status,
      cat: foundCat,
      link,
      desc: desc.slice(0, 200) + (desc.length > 200 ? '…' : ''),
    };
  }

  function stripHtml(html) {
    return html.replace(/<[^>]*>/g, '').replace(/&[a-z]+;/gi, ' ').replace(/\s+/g, ' ').trim();
  }
  function extractCompany(text) {
    const m = text.match(/기업명[:\s]+([^\s,]+)/);
    return m ? m[1] : null;
  }
  function extractSalary(text) {
    const m = text.match(/(월\s*[\d,]+만?원|시급\s*[\d,]+원|연봉\s*[\d,]+만?원)/);
    return m ? m[1] : null;
  }

  /* ── 렌더링 ── */
  function render() {
    const data = getData();
    renderList(data);
    updateFilterVisibility();
  }

  function getData() {
    let arr = state.page === 'jobs'      ? state.jobs
             : state.page === 'policy'   ? state.policies
             : getFavorites();

    // 상태 필터 (favorites는 필터 없음)
    if (state.page !== 'favorites') {
      arr = arr.filter(d => d.status === state.filterState);
    }

    // 카테고리 필터
    if (state.cat !== 'all') {
      arr = arr.filter(d => d.cat === state.cat || d.type === state.cat);
    }

    // 검색
    if (state.query.trim()) {
      const q = state.query.toLowerCase();
      arr = arr.filter(d =>
        (d.title + d.company + d.location + d.type).toLowerCase().includes(q)
      );
    }

    return arr;
  }

  function getFavorites() {
    const all = [...state.jobs, ...state.policies];
    return all.filter(d => state.favorites.includes(d.id));
  }

  function renderList(data) {
    if (!state.loaded) {
      listEl.innerHTML = renderSkeletons();
      return;
    }

    if (data.length === 0) {
      listEl.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🔍</div>
          <p>조건에 맞는 공고가 없습니다</p>
        </div>`;
      return;
    }

    // 빠른 메뉴 (채용공고 탭 모집중일 때만)
    const quickMenu = (state.page === 'jobs' && state.filterState === 'open')
      ? `<div class="quick-menu">
          <div class="quick-item" onclick="openSite('https://www.work24.go.kr')">
            <span class="quick-icon">🏢</span><span class="quick-label">고용24<br>바로가기</span>
          </div>
          <div class="quick-item" onclick="openSite('https://www.work24.go.kr/cm/c/1000/selectPolicyInfoByJobSeeker.do')">
            <span class="quick-icon">📋</span><span class="quick-label">취업지원<br>정책</span>
          </div>
          <div class="quick-item" onclick="openSite('https://www.work24.go.kr/cm/c/1000/rss/rssRecruitList.do')">
            <span class="quick-icon">📡</span><span class="quick-label">RSS<br>공고</span>
          </div>
          <div class="quick-item" onclick="changePage('favorites')">
            <span class="quick-icon">⭐</span><span class="quick-label">관심<br>목록</span>
          </div>
        </div>
        <p class="section-title">📌 채용공고 <span style="color:var(--text-muted);font-weight:500">${data.length}건</span></p>`
      : `<p class="section-title">${state.page === 'favorites' ? '⭐ 관심 목록' : '📋 지원정책'} <span style="color:var(--text-muted);font-weight:500">${data.length}건</span></p>`;

    const cards = data.map((item, i) => renderCard(item, i)).join('');
    listEl.innerHTML = quickMenu + cards;
  }

  function renderCard(item, i) {
    const isFav = state.favorites.includes(item.id);
    return `
      <div class="card" style="animation-delay:${i * 0.04}s" onclick="openDetail('${item.id}')">
        <div class="card-top">
          <h3>${escHtml(item.title)}</h3>
          <span class="card-badge ${item.status === 'open' ? 'open' : 'closed'}">
            ${item.status === 'open' ? '모집중' : '마감'}
          </span>
        </div>
        <div class="card-meta">
          <p>🏢 ${escHtml(item.company)}</p>
          <p>📍 ${escHtml(item.location)}</p>
          <p>💰 ${escHtml(item.salary)}</p>
          <p>⏰ ${escHtml(item.deadline)}</p>
        </div>
        <div class="card-tags">
          <span class="tag">${escHtml(item.type)}</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">
          <span class="card-arrow">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.35"><polyline points="9 18 15 12 9 6"/></svg>
          </span>
          <span class="fav-star ${isFav ? 'active' : ''}" onclick="toggleFav(event,'${item.id}')">
            ${isFav ? '★' : '☆'}
          </span>
        </div>
      </div>`;
  }

  function renderSkeletons() {
    return Array.from({length: 4}, () => `
      <div class="skeleton-card">
        <div class="skel skel-title"></div>
        <div class="skel skel-sub"></div>
        <div class="skel skel-sub2"></div>
      </div>`).join('');
  }

  /* ── 상세보기 ── */
  function openDetail(id) {
    const all = [...state.jobs, ...state.policies];
    const item = all.find(d => d.id === id);
    if (!item) return;
    state.currentItem = item;

    document.getElementById('detailBadge').textContent  = item.status === 'open' ? '모집중' : '마감';
    document.getElementById('detailBadge').className    = 'detail-badge' + (item.status === 'open' ? '' : ' closed');
    document.getElementById('detailTitle').textContent  = item.title;
    document.getElementById('detailCompany').textContent  = item.company;
    document.getElementById('detailLocation').textContent = item.location;
    document.getElementById('detailType').textContent     = item.type;
    document.getElementById('detailSalary').textContent   = item.salary;
    document.getElementById('detailDeadline').textContent = item.deadline;
    document.getElementById('detailSource').textContent   = '고용24';
    document.getElementById('detailLink').href = item.link;

    const descEl = document.getElementById('detailDesc');
    if (item.desc) {
      descEl.innerHTML = item.desc;
      descEl.classList.remove('hidden');
    } else {
      descEl.classList.add('hidden');
    }

    const favBtn = document.getElementById('detailFavBtn');
    const isFav = state.favorites.includes(id);
    favBtn.textContent = isFav ? '★ 관심 공고 해제' : '⭐ 관심 공고 저장';

    detailEl.classList.remove('hidden');
    detailEl.scrollTop = 0;
    document.body.style.overflow = 'hidden';
  }

  function closeDetail() {
    detailEl.classList.add('hidden');
    document.body.style.overflow = '';
  }

  /* ── 즐겨찾기 ── */
  function toggleFav(e, id) {
    e.stopPropagation();
    const idx = state.favorites.indexOf(id);
    if (idx >= 0) state.favorites.splice(idx, 1);
    else state.favorites.push(id);
    localStorage.setItem('emp24_favs', JSON.stringify(state.favorites));

    if (state.currentItem && state.currentItem.id === id) {
      const favBtn = document.getElementById('detailFavBtn');
      favBtn.textContent = state.favorites.includes(id) ? '★ 관심 공고 해제' : '⭐ 관심 공고 저장';
    }
    render();
  }

  /* ── 페이지 전환 ── */
  function changePage(page) {
    state.page = page;
    state.cat = 'all';
    state.query = '';
    searchInput.value = '';
    updateTabUI();
    updateFilterVisibility();
    render();
  }

  function updateTabUI() {
    document.querySelectorAll('.tab-btn[data-page]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.page === state.page);
    });
  }

  function updateFilterVisibility() {
    const showFilter = state.page !== 'favorites';
    filterRow.style.display = showFilter ? '' : 'none';
    chipRow.style.display   = state.page === 'jobs' ? '' : 'none';
  }

  /* ── 이벤트 바인딩 ── */
  function bindEvents() {
    // 탭
    document.querySelectorAll('.tab-btn[data-page]').forEach(btn => {
      btn.addEventListener('click', () => changePage(btn.dataset.page));
    });

    // 토글
    document.querySelectorAll('.toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.filterState = btn.dataset.state;
        document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const slider = document.querySelector('.toggle-slider');
        slider.style.transform = btn.dataset.state === 'closed' ? 'translateX(100%)' : '';
        render();
      });
    });

    // 카테고리 칩
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        state.cat = chip.dataset.cat;
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        render();
      });
    });

    // 검색
    let searchTimer;
    searchInput.addEventListener('input', e => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        state.query = e.target.value;
        render();
      }, 250);
    });

    // 뒤로가기
    backBtn.addEventListener('click', closeDetail);

    // 상세 – 즐겨찾기
    document.getElementById('detailFavBtn').addEventListener('click', () => {
      if (state.currentItem) toggleFav({ stopPropagation: ()=>{} }, state.currentItem.id);
    });

    // 상세 – 링크
    document.getElementById('detailLink').addEventListener('click', e => {
      const href = document.getElementById('detailLink').href;
      if (href && href !== '#') {
        e.preventDefault();
        overlay.classList.remove('hidden');
        setTimeout(() => { window.open(href, '_blank'); overlay.classList.add('hidden'); }, 600);
      }
    });
  }

  function openSite(url) {
    overlay.classList.remove('hidden');
    setTimeout(() => { window.open(url, '_blank'); overlay.classList.add('hidden'); }, 500);
  }

  function escHtml(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  </script>
</body>
</html>
